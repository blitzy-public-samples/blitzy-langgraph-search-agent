name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

env:
  AWS_REGION: us-east-1
  S3_BUCKET: langgraph-search-agent-frontend-production

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    
    # OIDC authentication permissions - enables secure AWS authentication
    # without requiring long-lived AWS access keys
    permissions:
      id-token: write   # Required for requesting OIDC JWT token
      contents: read    # Required for actions/checkout

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build
      env:
        VITE_API_URL: ${{ secrets.API_URL }}
      run: |
        cd frontend
        npm run build

    # OIDC-based AWS authentication - uses GitHub's OIDC provider
    # to assume an IAM role without storing long-lived credentials
    # Required secret: AWS_ROLE_ARN (provided by Terraform output: module.iam.github_actions_role_arn)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to S3
      run: |
        cd frontend
        aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
